# Override para servidores Linux onde o Ollama escuta só em 127.0.0.1 (padrão).
# O container usa a rede do host, então "localhost" é o próprio servidor.
# Uso: docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d --build
# Requer Docker Compose 2.24+.
services:
  rag:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      PORT: ${PORT:-3000}
      OLLAMA_BASE_URL: http://127.0.0.1:11434
