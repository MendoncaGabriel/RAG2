# Uso: docker network create app_net   (uma única vez)
#      docker compose up -d --build
# Nenhuma porta é publicada: o app escuta em 3000 dentro da rede app_net (acesse por um proxy nessa rede).
# A IA (Ollama, OpenAI, Gemini…) é cadastrada na tela de Configurações do app.
# Servidor Linux com IA local no próprio servidor: docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d --build
name: rag
services:
  rag:
    build: .
    image: rag-local
    init: true
    restart: unless-stopped
    user: "${APP_UID:-0}:${APP_GID:-0}"
    networks:
      - app_net
    environment:
      NODE_ENV: production
      PORT: 3000
      OCR_LANG: ${OCR_LANG:-por+eng}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      MIN_RELEVANCE_SCORE: ${MIN_RELEVANCE_SCORE:-0.18}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-7500}
      NEIGHBOR_EXPAND_TOP: ${NEIGHBOR_EXPAND_TOP:-2}
      QUERY_EXPANSION: ${QUERY_EXPANSION:-false}
      DOCUMENT_PROCESS_CONCURRENCY: ${DOCUMENT_PROCESS_CONCURRENCY:-1}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-1024}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
    volumes:
      - ./data:/app/data
    # Permite cadastrar provedores locais do host (ex.: http://host.docker.internal:11434) nas Configurações.
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app_net:
    name: app_net
    external: true
