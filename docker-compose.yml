# Uso: docker compose up -d --build   -> app em http://localhost:${PORT:-3000}
# Sobe junto o Ollama e baixa os modelos de chat e embeddings (primeira vez: alguns minutos, ~2 GB).
# Na primeira inicialização o app já cadastra e ativa esse Ollama; outros servidores Ollama podem ser adicionados em Configurações.
# O app só inicia depois que os modelos terminam de baixar. Acompanhe com: docker compose logs -f ollama-init
# Obs.: docker-compose.linux.yml (network_mode host) não alcança o Ollama por nome; use-o só com IA externa.
name: rag
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - app_net
    volumes:
      - ./data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Baixa os modelos (idempotente: nada é baixado de novo se já existirem) e encerra.
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    networks:
      - app_net
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c", "ollama pull $$OLLAMA_CHAT_MODEL && ollama pull $$OLLAMA_EMBEDDING_MODEL"]

  rag:
    build: .
    image: rag-local
    init: true
    restart: unless-stopped
    user: "${APP_UID:-0}:${APP_GID:-0}"
    networks:
      - app_net
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MASTER_USER: ${MASTER_USER:?defina MASTER_USER no .env}
      MASTER_PASSWORD: ${MASTER_PASSWORD:?defina MASTER_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      PORT: 3000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      OCR_LANG: ${OCR_LANG:-por+eng}
      CHUNK_SIZE: ${CHUNK_SIZE:-700}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-}
      MIN_RELEVANCE_SCORE: ${MIN_RELEVANCE_SCORE:-0.48}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-}
      NEIGHBOR_EXPAND_TOP: ${NEIGHBOR_EXPAND_TOP:-}
      DOCUMENT_PROCESS_CONCURRENCY: ${DOCUMENT_PROCESS_CONCURRENCY:-1}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-6}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
    volumes:
      - ./data:/app/data
    # Permite cadastrar o Ollama do host (ex.: http://host.docker.internal:11434) nas Configurações.
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app_net:
    name: app_net
