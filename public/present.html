<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAG</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <style>
    :root{color-scheme:dark;--ink:#f5f5f7;--muted:#a1a1aa;--line:rgba(255,255,255,.09)}
    html,body{height:100%}
    body{background:radial-gradient(ellipse at 50% -20%,#292932 0%,#17171b 48%,#101013 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.015em}
    input{background:rgba(12,12,15,.8);border:1px solid rgba(255,255,255,.14);color:var(--ink)}
    .user{background:rgba(48,65,105,.48);border:1px solid rgba(129,157,220,.2)}
    .bot{background:rgba(35,35,40,.82);border:1px solid var(--line)}
    .markdown-body{overflow-wrap:anywhere;line-height:1.65}.markdown-body>*+*{margin-top:.75em}.markdown-body h1,.markdown-body h2,.markdown-body h3{font-weight:700;line-height:1.3;margin-top:1.1em}.markdown-body ul,.markdown-body ol{padding-left:1.5em}.markdown-body ul{list-style:disc}.markdown-body ol{list-style:decimal}.markdown-body li+li{margin-top:.25em}.markdown-body blockquote{border-left:3px solid #6366f1;padding-left:.85em;color:#cbd5e1}.markdown-body pre{overflow-x:auto;border:1px solid var(--line);border-radius:.5rem;background:rgba(0,0,0,.3);padding:.85rem}.markdown-body code{border-radius:.25rem;background:rgba(0,0,0,.25);padding:.1em .3em;font-size:.9em}.markdown-body pre code{background:transparent;padding:0}.markdown-body a{color:#a5b4fc;text-decoration:underline}.markdown-body table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}.markdown-body th,.markdown-body td{border:1px solid var(--line);padding:.4em .65em}
  </style>
</head>
<body class="antialiased">
  <div class="mx-auto flex h-full max-w-4xl flex-col px-4 py-4 sm:px-6">
    <h1 id="title" class="py-3 text-center text-2xl font-bold sm:text-3xl break-words"></h1>
    <div id="messages" class="min-h-0 flex-1 space-y-4 overflow-y-auto overscroll-contain scroll-smooth py-3"></div>
    <form id="askForm" class="flex gap-2 pt-3">
      <input id="question" class="min-w-0 flex-1 rounded-lg px-3 py-3 text-base placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Pergunte sobre os documentos…" maxlength="5000" required autocomplete="off">
      <button class="rounded-lg bg-indigo-600 px-5 font-medium hover:bg-indigo-500 disabled:opacity-60">Enviar</button>
    </form>
  </div>
  <script>
    const $=s=>document.querySelector(s);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const md=v=>{const t=String(v).replace(/\s*\[Fonte\s+\d+[^\]]*\]/gi,'').trim();return window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(t,{gfm:true,breaks:true})):esc(t).replace(/\n/g,'<br>')};
    const bubble=(role,html)=>`<article class="${role==='user'?'user ml-8 whitespace-pre-wrap break-words':'bot mr-8 markdown-body'} rounded-xl p-4">${html}</article>`;
    const scroll=()=>{const b=$('#messages');b.scrollTop=b.scrollHeight};
    const notebook=new URLSearchParams(location.search).get('id');
    // Histórico só na sessão da aba (sessionStorage): nada é gravado no servidor.
    const storeKey='present:'+notebook;
    let history=[],sending=false;
    try{history=JSON.parse(sessionStorage.getItem(storeKey)||'[]').slice(-20)}catch{}
    const remember=()=>{history=history.slice(-20);try{sessionStorage.setItem(storeKey,JSON.stringify(history))}catch{}};
    async function api(url,opts){const r=await fetch(url,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Erro ${r.status}`);return d}
    async function init(){
      try{
        const r=await fetch(`/api/present/${encodeURIComponent(notebook)}`);
        if(r.status===401){location.replace('/login.html?next='+encodeURIComponent(location.pathname+location.search));return}
        const b=r.ok?await r.json():null;
        if(!b){$('#title').textContent='Notebook não encontrado';$('#askForm').remove();return}
        $('#title').textContent=b.name;document.title=b.name;
        $('#messages').innerHTML=history.map(m=>bubble(m.role==='user'?'user':'bot',m.role==='user'?esc(m.content):md(m.content))).join('');scroll();
        $('#question').focus();
      }catch(e){$('#title').textContent=e.message}
    }
    $('#askForm').onsubmit=async e=>{
      e.preventDefault();
      const input=$('#question'),content=input.value.trim();
      if(!content||sending)return;
      sending=true;const btn=e.target.querySelector('button');btn.disabled=true;input.value='';
      const box=$('#messages');
      box.insertAdjacentHTML('beforeend',bubble('user',esc(content))+bubble('bot','<span class="flex items-center gap-1 text-zinc-400" role="status" aria-label="A IA está pensando"><span class="animate-bounce">●</span><span class="animate-bounce [animation-delay:150ms]">●</span><span class="animate-bounce [animation-delay:300ms]">●</span><span class="ml-1 text-sm">Pensando…</span></span>'));
      const out=box.lastElementChild;scroll();
      try{
        const res=await fetch(`/api/present/${encodeURIComponent(notebook)}/ask`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content,history:history.slice(-6)})});
        if(!res.ok){const d=await res.json().catch(()=>({}));throw Error(d.error||`Erro ${res.status}`)}
        const reader=res.body.getReader(),dec=new TextDecoder();let buf='',text='',done=false;
        const handle=line=>{if(!line.trim())return;const ev=JSON.parse(line);if(ev.type==='token'){text+=ev.token;out.innerHTML=md(text);if(box.scrollHeight-box.scrollTop-box.clientHeight<160)scroll()}else if(ev.type==='done'){done=true;out.innerHTML=md(ev.assistant.content);history.push({role:'user',content},{role:'assistant',content:ev.assistant.content});remember()}else if(ev.type==='error')throw Error(ev.error)};
        for(;;){const {done:d,value}=await reader.read();if(d)break;buf+=dec.decode(value,{stream:true});const parts=buf.split('\n');buf=parts.pop();parts.forEach(handle)}
        handle(buf);
        if(!done)throw Error('A resposta foi interrompida.');
      }catch(x){out.className='rounded-xl border border-red-900 bg-red-950/40 p-4 text-sm text-red-300 mr-8';out.textContent='Não foi possível obter uma resposta: '+(x.message||x)}
      finally{sending=false;btn.disabled=false;input.focus();scroll()}
    };
    init();
  </script>
</body>
</html>
