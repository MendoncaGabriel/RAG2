<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar · RAG</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{color-scheme:dark}
    body{background:radial-gradient(ellipse at 50% -20%,#292932 0%,#17171b 48%,#101013 100%);color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.015em}
    input{background:rgba(12,12,15,.8);border:1px solid rgba(255,255,255,.14);color:#f5f5f7}
  </style>
</head>
<body class="flex min-h-screen items-center justify-center px-4 antialiased">
  <form id="form" method="post" action="/api/auth/login" onsubmit="return false" class="w-full max-w-sm rounded-2xl border border-white/10 bg-zinc-900/80 p-6 shadow-2xl sm:p-8">
    <div class="mb-1 text-xs font-semibold uppercase tracking-widest text-indigo-400">RAG</div>
    <h1 class="text-2xl font-bold">Entrar</h1>
    <div class="mt-6 space-y-4">
      <label class="block text-sm font-medium">Usuário<input id="username" name="username" autocomplete="username" required maxlength="200" autofocus class="mt-2 w-full rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-600"></label>
      <label class="block text-sm font-medium">Senha<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="500" class="mt-2 w-full rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-600"></label>
      <p id="error" class="hidden rounded-lg border border-red-900 bg-red-950/40 px-3 py-2 text-sm text-red-300"></p>
      <button id="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 font-medium text-white hover:bg-indigo-500 disabled:opacity-60">Entrar</button>
    </div>
  </form>
  <script>
    const raw=new URLSearchParams(location.search).get('next')||'/';
    const next=raw.startsWith('/')&&!raw.startsWith('//')&&!raw.includes('\\')?raw:'/';
    fetch('/api/auth/me').then(r=>{if(r.ok)location.replace(next)}).catch(()=>{});
    document.getElementById('form').onsubmit=async e=>{
      e.preventDefault();
      const btn=document.getElementById('submit'),err=document.getElementById('error');
      btn.disabled=true;err.classList.add('hidden');
      try{
        const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok)throw Error(d.error||`Erro ${r.status}`);
        location.replace(next);
      }catch(x){err.textContent=x.message;err.classList.remove('hidden');btn.disabled=false;document.getElementById('password').select()}
    };
  </script>
</body>
</html>
