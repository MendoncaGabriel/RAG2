<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IA</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <style>
    /* Página feita para rodar dentro de um iframe: fundo transparente, bolinha no canto inferior direito e chat flutuante. */
    :root{--ink:#f4f4f8;--muted:#9a9aab;--line:rgba(255,255,255,.08);--b1:#4f46e5;--b2:#7c3aed;--b3:#a78bfa;--grad:linear-gradient(135deg,#4f46e5,#7c3aed)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:transparent;overflow:hidden}
    body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;letter-spacing:-.01em;font-size:14px}
    [hidden]{display:none!important}
    button{font-family:inherit}
    :focus-visible{outline:2px solid #c4b5fd;outline-offset:2px}
    input:focus,input:focus-visible{outline:none;box-shadow:none}

    /* ===== Bolinha ===== */
    #fab{position:absolute;right:16px;bottom:16px;width:44px;height:44px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both,float 3.6s ease-in-out .6s infinite}
        #bubble{position:relative;width:100%;height:100%;border:0;border-radius:50%;cursor:pointer;color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em;background:var(--grad);box-shadow:0 0 0 1px rgba(255,255,255,.16) inset,0 2px 8px rgba(79,70,229,.4);overflow:hidden;transition:transform .2s cubic-bezier(.2,1.4,.4,1),box-shadow .2s}
    #bubble::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 60%,rgba(255,255,255,.55) 80%,transparent 100%);animation:spin 3.2s linear infinite}
    #bubble::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--grad)}
    #bubble span{position:relative;z-index:1;text-shadow:0 1px 4px rgba(0,0,0,.35)}
    #bubble:hover{transform:scale(1.14) rotate(-6deg);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 3px 10px rgba(79,70,229,.5)}
    #bubble:active{transform:scale(.92)}
    .spark{position:absolute;top:-3px;right:-3px;width:14px;height:14px;z-index:2;color:#fde68a;animation:twinkle 2s ease-in-out infinite;pointer-events:none}
    #fab{transition:opacity .15s}#fab.off{opacity:0;pointer-events:none}
    @keyframes pop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.6}50%{transform:scale(1.15) rotate(35deg);opacity:1}}

    /* ===== Painel ===== */
    #panel{position:absolute;inset:14px;display:flex;flex-direction:column;overflow:hidden;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:#18181d;box-shadow:0 2px 10px rgba(0,0,0,.28);transform-origin:100% 100%;animation:open .28s cubic-bezier(.2,1.1,.3,1) both}
    #panel.closing{animation:close .16s ease-in both}
    @keyframes open{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}
    @keyframes close{to{opacity:0;transform:translateY(10px) scale(.88)}}
    header{position:relative;display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;background:#1f1f27;border-bottom:1px solid var(--line);color:var(--ink)}
    .avatar{position:relative;flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--grad);color:#fff}
    .avatar i{position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#4ade80;border:2px solid #1f1f27}
    .head-text{flex:1;min-width:0}
    header h1{margin:0;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
    #close{position:relative;z-index:1;flex:none;width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:14px;line-height:1;cursor:pointer;transition:background .15s,transform .2s}
    #close:hover{background:rgba(255,255,255,.1);color:var(--ink)}

    #messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
    #messages::-webkit-scrollbar{width:6px}#messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
    .msg{max-width:88%;padding:10px 13px;border-radius:16px;overflow-wrap:anywhere;animation:in .25s ease both;line-height:1.55}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .user{align-self:flex-end;border-bottom-right-radius:5px;background:var(--grad);color:#fff;white-space:pre-wrap;box-shadow:0 1px 4px rgba(79,70,229,.25)}
    .bot{align-self:flex-start;border-bottom-left-radius:5px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
    .err{align-self:flex-start;border-radius:14px;background:rgba(127,29,29,.3);border:1px solid rgba(248,113,113,.35);color:#fca5a5;font-size:13px}
    .hint{margin:auto;padding:0 20px;text-align:center;color:var(--muted);line-height:1.6}
    .hint b{display:block;margin-bottom:6px;font-size:16px;color:var(--ink)}
    .hint .big{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 12px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;box-shadow:0 2px 8px rgba(79,70,229,.35)}

    form{display:flex;align-items:center;gap:8px;margin:0 12px 12px;padding:5px 5px 5px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);transition:border-color .15s,box-shadow .15s}
    form:focus-within{border-color:var(--b3)}
    input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:8px 0}
    input::placeholder{color:#6f6f80}
    form button{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--grad);color:#fff;cursor:pointer;transition:transform .15s,opacity .15s}
    form button:hover{transform:scale(1.08)}form button:disabled{opacity:.5;cursor:default;transform:none}
    form svg{width:17px;height:17px}

    .dots{display:inline-flex;gap:4px;vertical-align:middle;margin-right:6px}
    .dots span{width:6px;height:6px;border-radius:50%;background:var(--b3);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
    @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
    .markdown-body>*+*{margin-top:.7em}.markdown-body p,.markdown-body ul,.markdown-body ol{margin:0}.markdown-body h1,.markdown-body h2,.markdown-body h3{font-size:1em;font-weight:700;margin:.8em 0 0}.markdown-body ul,.markdown-body ol{padding-left:1.4em}.markdown-body ul{list-style:disc}.markdown-body ol{list-style:decimal}.markdown-body li+li{margin-top:.2em}.markdown-body blockquote{margin:0;border-left:3px solid var(--b3);padding-left:.8em;color:#cbd5e1}.markdown-body pre{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.35);padding:.7rem;margin:0}.markdown-body code{border-radius:4px;background:rgba(0,0,0,.28);padding:.1em .3em;font-size:.9em}.markdown-body pre code{background:transparent;padding:0}.markdown-body a{color:#c4b5fd;text-decoration:underline}.markdown-body table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}.markdown-body th,.markdown-body td{border:1px solid var(--line);padding:.35em .6em}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="fab">
    <button id="bubble" type="button" aria-label="Abrir chat com a IA" aria-expanded="false"><span>IA</span></button>
    <svg class="spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0l2.6 8.4L23 11l-8.4 2.6L12 22l-2.6-8.4L1 11l8.4-2.6z"/></svg>
  </div>
  <section id="panel" hidden role="dialog" aria-label="Chat com a IA">
    <header>
      <div class="avatar">IA<i></i></div>
      <div class="head-text"><h1 id="title">IA</h1><p>Assistente dos documentos</p></div>
      <button id="close" type="button" aria-label="Fechar chat">✕</button>
    </header>
    <div id="messages" aria-live="polite"></div>
    <form id="askForm">
      <input id="question" placeholder="Digite sua pergunta…" maxlength="5000" required autocomplete="off">
      <button aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
    </form>
  </section>
  <script>
    const $=s=>document.querySelector(s);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const md=v=>{const t=String(v).replace(/\s*\[Fonte\s+\d+[^\]]*\]/gi,'').trim();return window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(t,{gfm:true,breaks:true})):esc(t).replace(/\n/g,'<br>')};
    const bubble=(role,html)=>`<article class="msg ${role==='user'?'user':'bot markdown-body'}">${html}</article>`;
    const box=$('#messages'),scroll=()=>{box.scrollTop=box.scrollHeight};
    const notebook=new URLSearchParams(location.search).get('id');
    // Pede ao iframe externo para crescer/encolher (o código incorporado trata a mensagem).
    const resize=open=>{try{parent.postMessage(open?{rag:1,w:416,h:620}:{rag:1,w:76,h:76},'*')}catch{}};
    // Histórico só na sessão da aba (sessionStorage): nada é gravado no servidor.
    const storeKey='embed:'+notebook;
    let history=[],sending=false,loaded=false,ready=false,closeTimer=0;
    try{history=JSON.parse(sessionStorage.getItem(storeKey)||'[]').slice(-20)}catch{}
    const remember=()=>{history=history.slice(-20);try{sessionStorage.setItem(storeKey,JSON.stringify(history))}catch{}};
    const hint=(title,text)=>{box.innerHTML=`<div class="hint"><div class="big">IA</div><b>${esc(title)}</b>${esc(text)}</div>`};
    async function load(){
      if(loaded)return;
      try{
        const r=await fetch(`/api/present/${encodeURIComponent(notebook)}`);
        if(r.status===401){hint('Notebook privado','Peça ao responsável para torná-lo público.');$('#askForm').hidden=true;return}
        if(!r.ok){hint('Não encontrado','Este notebook não existe mais.');$('#askForm').hidden=true;return}
        const b=await r.json();loaded=ready=true;$('#title').textContent=b.name||'IA';
        if(history.length)box.innerHTML=history.map(m=>bubble(m.role==='user'?'user':'bot',m.role==='user'?esc(m.content):md(m.content))).join('');
        else hint('Olá! 👋','Pergunte qualquer coisa sobre os documentos deste notebook.');
        scroll();
      }catch(e){hint('Algo deu errado',e.message)}
    }
    function toggle(open){
      clearTimeout(closeTimer);const panel=$('#panel');
      if(open){
        panel.classList.remove('closing');panel.hidden=false;$('#fab').classList.add('off');$('#bubble').tabIndex=-1;$('#bubble').setAttribute('aria-expanded','true');
        resize(true);load().then(()=>{$('#question').focus();scroll()});
      }else{
        // Anima o fechamento antes de encolher o iframe.
        panel.classList.add('closing');
        closeTimer=setTimeout(()=>{panel.hidden=true;panel.classList.remove('closing');$('#fab').classList.remove('off');$('#bubble').tabIndex=0;$('#bubble').setAttribute('aria-expanded','false');resize(false);$('#bubble').focus()},160);
      }
    }
    $('#bubble').onclick=()=>toggle(true);
    $('#close').onclick=()=>toggle(false);
    addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#panel').hidden)toggle(false)});
    $('#askForm').onsubmit=async e=>{
      e.preventDefault();
      const input=$('#question'),content=input.value.trim();
      if(!content||sending||!ready)return;
      sending=true;const btn=e.target.querySelector('button');btn.disabled=true;input.value='';
      if(box.querySelector('.hint'))box.innerHTML='';
      box.insertAdjacentHTML('beforeend',bubble('user',esc(content))+bubble('bot','<span class="dots" role="status" aria-label="A IA está pensando"><span></span><span></span><span></span></span>Pensando…'));
      const out=box.lastElementChild;scroll();
      try{
        const res=await fetch(`/api/present/${encodeURIComponent(notebook)}/ask`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content,history:history.slice(-6)})});
        if(!res.ok){const d=await res.json().catch(()=>({}));throw Error(d.error||(res.status===429?'Muitas perguntas seguidas. Aguarde um instante.':`Erro ${res.status}`))}
        const reader=res.body.getReader(),dec=new TextDecoder();let buf='',text='',done=false;
        const handle=line=>{if(!line.trim())return;const ev=JSON.parse(line);if(ev.type==='token'){text+=ev.token;out.innerHTML=md(text);if(box.scrollHeight-box.scrollTop-box.clientHeight<120)scroll()}else if(ev.type==='done'){done=true;out.innerHTML=md(ev.assistant.content);history.push({role:'user',content},{role:'assistant',content:ev.assistant.content});remember()}else if(ev.type==='error')throw Error(ev.error)};
        for(;;){const {done:d,value}=await reader.read();if(d)break;buf+=dec.decode(value,{stream:true});const parts=buf.split('\n');buf=parts.pop();parts.forEach(handle)}
        handle(buf);
        if(!done)throw Error('A resposta foi interrompida.');
      }catch(x){out.className='msg err';out.textContent='Não foi possível obter uma resposta: '+(x.message||x)}
      finally{sending=false;btn.disabled=false;input.focus();scroll()}
    };
  </script>
</body>
</html>
