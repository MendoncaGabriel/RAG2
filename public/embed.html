<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Roboto:wght@400;500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <style>
    /* Página feita para rodar dentro de um iframe: fundo transparente, bolinha no canto inferior direito e chat flutuante.
       Cores do Jabil Brand Guidelines: Jabil Blue, Navy, Light Blue (linhas/realces sobre branco), Sky Blue (realces sobre azul). */
    :root{--jabil:#003865;--navy:#002B49;--old:#005288;--medium:#0164A1;--light:#0990CF;--sky:#15BEF0;--ink:#414042;--muted:#60605B;--line:#CCCCCC;--canvas:#F1F2F2;--danger:#CB333B;color-scheme:light}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:transparent;overflow:hidden}
    body{color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px}
    [hidden]{display:none!important}
    button{font-family:inherit}
    :focus-visible{outline:2px solid var(--light);outline-offset:2px}
    input:focus,input:focus-visible{outline:none;box-shadow:none}
    .logo{display:block;width:60%;height:60%}

    /* ===== Bolinha ===== */
    #fab{position:absolute;right:16px;bottom:16px;width:44px;height:44px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both,float 3.6s ease-in-out .6s infinite}
    #bubble{position:relative;display:grid;place-items:center;width:100%;height:100%;border:0;border-radius:50%;cursor:pointer;color:#fff;background:var(--jabil);box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 2px 8px rgba(0,43,73,.35);overflow:hidden;transition:transform .2s cubic-bezier(.2,1.4,.4,1),box-shadow .2s}
    #bubble::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 62%,var(--sky) 82%,transparent 100%);animation:spin 3.2s linear infinite}
    #bubble::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--jabil)}
    #bubble svg{position:relative;z-index:1}
    #bubble:hover{transform:scale(1.12);box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 3px 12px rgba(0,43,73,.45)}
    #bubble:active{transform:scale(.92)}
    #fab{transition:opacity .15s}#fab.off{opacity:0;pointer-events:none}
    @keyframes pop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ===== Painel ===== */
    #panel{position:absolute;inset:14px;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:0 4px 18px rgba(0,43,73,.18);transform-origin:100% 100%;animation:open .28s cubic-bezier(.2,1.1,.3,1) both}
    #panel.closing{animation:close .16s ease-in both}
    @keyframes open{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}
    @keyframes close{to{opacity:0;transform:translateY(10px) scale(.88)}}
    header{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;background:var(--jabil);border-bottom:3px solid var(--sky);color:#fff}
    .avatar{position:relative;flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--navy)}
    .avatar i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:#7FBA00;border:2px solid var(--jabil)}
    .head-text{flex:1;min-width:0}
    header{gap:10px}
    header h1{margin:0;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    header p{margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #mode{position:relative;z-index:1;flex:none;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 6px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:500;line-height:1;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s}
    #mode:hover{background:rgba(255,255,255,.2)}
    #mode .track{position:relative;flex:none;width:20px;height:12px;border-radius:999px;background:rgba(255,255,255,.35);transition:background .2s}
    #mode .knob{position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.3,.5,1)}
    #mode[aria-checked="true"]{border-color:var(--sky)}
    #mode[aria-checked="true"] .track{background:var(--sky)}
    #mode[aria-checked="true"] .knob{transform:translateX(8px)}
    #modeLabel{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    #mode .lbl{display:inline-grid}
    #mode .lbl>span{grid-area:1/1;text-align:left}
    #mode[aria-checked="false"] .lbl>[data-m="1"],#mode[aria-checked="true"] .lbl>[data-m="0"]{visibility:hidden}
    #close{position:relative;z-index:1;flex:none;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.85);font-size:15px;line-height:1;cursor:pointer;transition:background .15s}
    #close:hover{background:rgba(255,255,255,.12);color:#fff}

    #messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;background:var(--canvas)}
    #messages::-webkit-scrollbar{width:6px}#messages::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
    .msg{max-width:88%;padding:10px 13px;border-radius:12px;overflow-wrap:anywhere;animation:in .25s ease both;line-height:1.55}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .user{align-self:flex-end;border-bottom-right-radius:4px;background:var(--jabil);color:#fff;white-space:pre-wrap}
    .bot{align-self:flex-start;border-bottom-left-radius:4px;background:#fff;border:1px solid var(--line)}
    .err{align-self:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--danger);color:var(--danger);font-size:13px}
    .hint{margin:auto;padding:0 20px;text-align:center;color:var(--muted);line-height:1.6}
    .hint b{display:block;margin-bottom:6px;font-size:16px;color:var(--jabil)}
    .hint .big{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 12px;border-radius:14px;background:var(--jabil)}

    form{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px 12px;border-top:1px solid var(--line);background:#fff}
    .box{display:flex;flex:1;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-radius:10px;border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
    .box:focus-within{border-color:var(--light);box-shadow:0 0 0 3px rgba(9,144,207,.2)}
    input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:8px 0}
    input::placeholder{color:#939598}
    form button{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:8px;background:var(--jabil);color:#fff;cursor:pointer;transition:background .15s,opacity .15s}
    form button:hover{background:var(--old)}form button:disabled{opacity:.5;cursor:default}
    form svg{width:17px;height:17px}

    .dots{display:inline-flex;gap:4px;vertical-align:middle;margin-right:6px}
    .dots span{width:6px;height:6px;border-radius:50%;background:var(--light);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
    @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
    .markdown-body>*+*{margin-top:.7em}.markdown-body p,.markdown-body ul,.markdown-body ol{margin:0}.markdown-body h1,.markdown-body h2,.markdown-body h3{font-size:1em;font-weight:700;margin:.8em 0 0;color:var(--jabil)}.markdown-body ul,.markdown-body ol{padding-left:1.4em}.markdown-body ul{list-style:disc}.markdown-body ol{list-style:decimal}.markdown-body li+li{margin-top:.2em}.markdown-body blockquote{margin:0;border-left:3px solid var(--light);padding-left:.8em;color:var(--muted)}.markdown-body pre{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--canvas);padding:.7rem;margin:0}.markdown-body code{border-radius:4px;background:var(--canvas);padding:.1em .3em;font-size:.9em}.markdown-body pre code{background:transparent;padding:0}.markdown-body a{color:var(--medium);text-decoration:underline}.markdown-body table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}.markdown-body th{background:var(--canvas);color:var(--jabil);text-align:left}.markdown-body th,.markdown-body td{border:1px solid var(--line);padding:.35em .6em}.markdown-body strong{color:var(--jabil)}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="fab">
    <button id="bubble" type="button" aria-label="Abrir chat com o Bento" aria-expanded="false"><svg class="logo" viewBox="12 12 40 40" aria-hidden="true"><rect x="14" y="14" width="36" height="36" rx="5" fill="none" stroke="#fff" stroke-width="4"/><path d="M32 16v32M32 32h16" stroke="#fff" stroke-width="4"/><rect x="36" y="18" width="10" height="10" rx="2" fill="#15BEF0"/></svg></button>
  </div>
  <section id="panel" hidden role="dialog" aria-label="Chat com o Bento">
    <header>
      <div class="avatar"><svg class="logo" viewBox="12 12 40 40" aria-hidden="true"><rect x="14" y="14" width="36" height="36" rx="5" fill="none" stroke="#fff" stroke-width="4"/><path d="M32 16v32M32 32h16" stroke="#fff" stroke-width="4"/><rect x="36" y="18" width="10" height="10" rx="2" fill="#15BEF0"/></svg><i></i></div>
      <div class="head-text"><h1 id="title">Bento</h1><p>Assistente dos documentos</p></div>
      <button id="mode" type="button" role="switch" aria-checked="false" title="Rápido: respostas curtas e rápidas. Detalhado: respostas mais longas e completas, mas mais demoradas."><span class="track" aria-hidden="true"><span class="knob"></span></span><span class="lbl" aria-hidden="true"><span data-m="0">Rápido</span><span data-m="1">Detalhado</span></span><span class="sr-only" id="modeLabel">Rápido</span></button>
      <button id="close" type="button" aria-label="Fechar chat">✕</button>
    </header>
    <div id="messages" aria-live="polite"></div>
    <form id="askForm">
      <div class="box">
        <input id="question" placeholder="Digite sua pergunta…" maxlength="5000" required autocomplete="off" aria-label="Pergunta">
        <button aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
      </div>
    </form>
  </section>
  <script>
    const $=s=>document.querySelector(s);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const md=v=>{const t=String(v).replace(/\s*\[Fonte\s+\d+[^\]]*\]/gi,'').trim();return window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(t,{gfm:true,breaks:true})):esc(t).replace(/\n/g,'<br>')};
    const bubble=(role,html)=>`<article class="msg ${role==='user'?'user':'bot markdown-body'}">${html}</article>`;
    const box=$('#messages'),scroll=()=>{box.scrollTop=box.scrollHeight};
    const notebook=new URLSearchParams(location.search).get('id');
    const logo=$('#bubble svg').outerHTML;
    // Pede ao iframe externo para crescer/encolher. Envia "bento" (código atual) e "rag" (códigos incorporados antes da troca de nome).
    const resize=open=>{try{parent.postMessage(open?{bento:1,rag:1,w:416,h:620}:{bento:1,rag:1,w:76,h:76},'*')}catch{}};
    // Histórico só na sessão da aba (sessionStorage): nada é gravado no servidor.
    const storeKey='embed:'+notebook;
    let history=[],sending=false,loaded=false,ready=false,closeTimer=0,detailed=false;
    try{detailed=sessionStorage.getItem('embed-detail:'+notebook)==='1'}catch{}
    const paintMode=()=>{$('#mode').setAttribute('aria-checked',String(detailed));$('#modeLabel').textContent=detailed?'Detalhado':'Rápido'};paintMode();
    $('#mode').onclick=()=>{detailed=!detailed;try{sessionStorage.setItem('embed-detail:'+notebook,detailed?'1':'0')}catch{}paintMode()};
    try{history=JSON.parse(sessionStorage.getItem(storeKey)||'[]').slice(-20)}catch{}
    const remember=()=>{history=history.slice(-20);try{sessionStorage.setItem(storeKey,JSON.stringify(history))}catch{}};
    const hint=(title,text)=>{box.innerHTML=`<div class="hint"><div class="big">${logo}</div><b>${esc(title)}</b>${esc(text)}</div>`};
    async function load(){
      if(loaded)return;
      try{
        const r=await fetch(`/api/present/${encodeURIComponent(notebook)}`);
        if(r.status===401){hint('Notebook privado','Peça ao responsável para torná-lo público.');$('#askForm').hidden=true;return}
        if(!r.ok){hint('Não encontrado','Este notebook não existe mais.');$('#askForm').hidden=true;return}
        const b=await r.json();loaded=ready=true;$('#title').textContent=b.name||'Bento';
        if(history.length)box.innerHTML=history.map(m=>bubble(m.role==='user'?'user':'bot',m.role==='user'?esc(m.content):md(m.content))).join('');
        else hint('Olá! 👋','Pergunte qualquer coisa sobre os documentos deste notebook.');
        scroll();
      }catch(e){hint('Algo deu errado',e.message)}
    }
    function toggle(open){
      clearTimeout(closeTimer);const panel=$('#panel');
      if(open){
        panel.classList.remove('closing');panel.hidden=false;$('#fab').classList.add('off');$('#bubble').tabIndex=-1;$('#bubble').setAttribute('aria-expanded','true');
        resize(true);load().then(()=>{$('#question').focus();scroll()});
      }else{
        // Anima o fechamento antes de encolher o iframe.
        panel.classList.add('closing');
        closeTimer=setTimeout(()=>{panel.hidden=true;panel.classList.remove('closing');$('#fab').classList.remove('off');$('#bubble').tabIndex=0;$('#bubble').setAttribute('aria-expanded','false');resize(false);$('#bubble').focus()},160);
      }
    }
    $('#bubble').onclick=()=>toggle(true);
    $('#close').onclick=()=>toggle(false);
    addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#panel').hidden)toggle(false)});
    $('#askForm').onsubmit=async e=>{
      e.preventDefault();
      const input=$('#question'),content=input.value.trim();
      if(!content||sending||!ready)return;
      sending=true;const btn=e.target.querySelector('button');btn.disabled=true;input.value='';
      if(box.querySelector('.hint'))box.innerHTML='';
      box.insertAdjacentHTML('beforeend',bubble('user',esc(content))+bubble('bot','<span class="dots" role="status" aria-label="O Bento está pensando"><span></span><span></span><span></span></span>Pensando…'));
      const out=box.lastElementChild;scroll();
      try{
        const res=await fetch(`/api/present/${encodeURIComponent(notebook)}/ask`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content,history:history.slice(-6),detailed})});
        if(!res.ok){const d=await res.json().catch(()=>({}));throw Error(d.error||(res.status===429?'Muitas perguntas seguidas. Aguarde um instante.':`Erro ${res.status}`))}
        const reader=res.body.getReader(),dec=new TextDecoder();let buf='',text='',done=false;
        const handle=line=>{if(!line.trim())return;const ev=JSON.parse(line);if(ev.type==='token'){text+=ev.token;out.innerHTML=md(text);if(box.scrollHeight-box.scrollTop-box.clientHeight<120)scroll()}else if(ev.type==='done'){done=true;out.innerHTML=md(ev.assistant.content);history.push({role:'user',content},{role:'assistant',content:ev.assistant.content});remember()}else if(ev.type==='error')throw Error(ev.error)};
        for(;;){const {done:d,value}=await reader.read();if(d)break;buf+=dec.decode(value,{stream:true});const parts=buf.split('\n');buf=parts.pop();parts.forEach(handle)}
        handle(buf);
        if(!done)throw Error('A resposta foi interrompida.');
      }catch(x){out.className='msg err';out.textContent='Não foi possível obter uma resposta: '+(x.message||x)}
      finally{sending=false;btn.disabled=false;input.focus();scroll()}
    };
  </script>
</body>
</html>
